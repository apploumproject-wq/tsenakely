name: TSENAKELY - Build APK Android

on:
  push:
    branches:
      - main
      - classic
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Construire l'APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Installer les composants Android
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Installer les dependances du projet
        run: npm install

      - name: Configurer l'identite de l'application
        run: |
          python3 - <<'PY'
          import json, os
          path = "capacitor.config.json"
          with open(path, encoding="utf-8") as f:
              config = json.load(f)
          if os.environ["GITHUB_REF_NAME"] == "classic":
              config["appId"] = "mg.apploumproject.tsenakely.classic"
              config["appName"] = "TSENAKELY CLASSIQUE"
          else:
              config["appId"] = "mg.apploumproject.tsenakely"
              config["appName"] = "TSENAKELY PRO"
          with open(path, "w", encoding="utf-8") as f:
              json.dump(config, f, ensure_ascii=False, indent=2)
              f.write("\\n")
          PY

      - name: Construire les fichiers Android
        run: npm run build
        env:
          BUILD_TARGET: android

      - name: Ajouter la plateforme Android
        run: npx cap add android

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Compiler l'APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Publier le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: TSENAKELY-${{ github.ref_name == 'classic' && 'CLASSIQUE' || 'PRO' }}-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
